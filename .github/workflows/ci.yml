name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run for the same ref pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the quick signal; Windows is where this actually gets run.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches pythonVersion in pyrightconfig.json and target-version in ruff.toml.
          python-version: "3.14"

      - name: Create .venv and put it on PATH
        shell: bash
        run: |
          python -m venv .venv
          # pyrightconfig.json points at ./.venv, so the checks must resolve imports there.
          # bash runs on the Windows runner too, so one branch covers both layouts.
          if [ -d .venv/bin ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -c "import sys; print(sys.version)"

      - name: Byte-compile
        shell: bash
        run: python -m compileall -q igdl.py

      - name: Import check
        shell: bash
        # compileall only proves the syntax parses; importing proves the module and its
        # dependencies actually load.
        run: python -c "import igdl; print('imported', igdl.__name__)"

      - name: CLI smoke test
        shell: bash
        # Exercises argparse for every subcommand, which byte-compiling cannot reach.
        run: |
          python igdl.py --help > /dev/null
          for mode in post liked saved export; do
            python igdl.py "$mode" --help > /dev/null
          done
          echo "all subcommands parsed"

      - name: ruff
        shell: bash
        run: python -m ruff check --output-format github .

      - name: basedpyright
        shell: bash
        # This config already exits non-zero on warnings, but --warnings states the
        # intent so the gate survives a future change to the strictness settings.
        run: python -m basedpyright --warnings .
